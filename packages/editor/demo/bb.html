<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script src="https://cdn.jsdelivr.net/npm/prettier@3.3.3/standalone.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prettier@3.3.3/plugins/babel.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prettier@3.3.3/plugins/estree.js"></script>
  <script>
    (async () => {
      const formatted = await prettier.format(`
    {
                "hello": "world",
      // 不是哥们
      "not": "a",
      "guy": "bro",
      ok: 1,

      }
      `, {
        parser: "json5",
        plugins: prettierPlugins,
      });

      console.log('formatted', formatted)
    })();
  </script>
</body>

</html>
